name: TengaAgent dependency remediation

on:
  push:
    branches:
      - fix/tengaagent-security-deps-20260920

concurrency:
  group: tengaagent-dependency-remediation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Apply non-breaking npm audit fixes to all lockfiles
        shell: bash
        run: |
          set -uo pipefail
          for project in . backend frontend; do
            echo "::group::Remediate $project"
            (
              cd "$project" || exit 1
              npm install --package-lock-only --ignore-scripts || exit 1
              npm ci || exit 1
              npm audit fix
              result=$?
              echo "npm audit fix exit code: $result (remaining advisories may require manual dependency updates)"
              exit 0
            ) || exit 1
            echo "::endgroup::"
          done

      - name: Verify reproducible installs from updated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for project in . backend frontend; do
            echo "::group::Clean installation: $project"
            ( cd "$project" && npm ci )
            echo "::endgroup::"
          done

      - name: TengaAgent backend regression tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: tengaagent-ci-jwt-secret
          TENGAAGENT_CALENDAR_ENCRYPTION_KEY: tengaagent-ci-calendar-encryption-key-2026
        run: npx cross-env NODE_PATH=./node_modules jest tests/tengaAgent*.test.js --runInBand --testTimeout=60000 --hookTimeout=60000

      - name: TengaAgent frontend regression tests
        working-directory: frontend
        run: npx vitest run src/pages/tengaAgent/__tests__ --reporter=dot --testTimeout=20000 --hookTimeout=20000

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Report remaining audit findings
        shell: bash
        run: |
          for project in . backend frontend; do
            echo "::group::Audit $project (all dependencies)"
            ( cd "$project" && npm audit --audit-level=high ) || true
            echo "::endgroup::"
            echo "::group::Audit $project (production dependencies)"
            ( cd "$project" && npm audit --omit=dev --audit-level=high ) || true
            echo "::endgroup::"
          done

      - name: Reject high-severity dependency vulnerabilities in all three projects
        shell: bash
        run: |
          set -euo pipefail
          for project in . backend frontend; do
            ( cd "$project" && npm audit --audit-level=high )
          done

      - name: Commit only tested dependency manifest and lockfile changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No non-breaking dependency changes available."
          else
            git commit -m "fix(security): refresh audited npm dependency lockfiles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
