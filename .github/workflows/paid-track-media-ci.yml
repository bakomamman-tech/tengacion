name: Paid Track Media Protection CI

on:
  pull_request:
    paths:
      - "backend/services/mediaSigner.js"
      - "backend/services/trackMediaAccessService.js"
      - "backend/routes/media.js"
      - "backend/routes/tracks.js"
      - "backend/controllers/tracksController.js"
      - "backend/services/publicCreatorProfileService.js"
      - "backend/services/creatorDiscoveryService.js"
      - "backend/services/storyMusicService.js"
      - "backend/tests/paidTrackMediaDeliveryProtection.test.js"
      - "backend/tests/trackPublicMetadataProtection.test.js"
      - "backend/tests/paystackPayments.test.js"
      - "backend/tests/creatorDiscoveryRoutes.test.js"
      - "backend/tests/storyMusicAttachment.test.js"
      - ".github/workflows/paid-track-media-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/services/mediaSigner.js"
      - "backend/services/trackMediaAccessService.js"
      - "backend/routes/media.js"
      - "backend/routes/tracks.js"
      - "backend/controllers/tracksController.js"
      - "backend/services/publicCreatorProfileService.js"
      - "backend/services/creatorDiscoveryService.js"
      - "backend/services/storyMusicService.js"
      - "backend/tests/paidTrackMediaDeliveryProtection.test.js"
      - "backend/tests/trackPublicMetadataProtection.test.js"
      - "backend/tests/paystackPayments.test.js"
      - "backend/tests/creatorDiscoveryRoutes.test.js"
      - "backend/tests/storyMusicAttachment.test.js"
      - ".github/workflows/paid-track-media-ci.yml"

permissions:
  contents: read

jobs:
  paid-track-media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      NODE_PATH: ${{ github.workspace }}/backend/node_modules
      MONGO_URI: mongodb://127.0.0.1:27017/tengacion-paid-track-ci
      JWT_SECRET: paid-track-ci-jwt-secret-12345678901234567890
      MEDIA_SIGNING_SECRET: paid-track-ci-media-signing-secret-1234567890
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Syntax check paid-track protection
        run: |
          node --check services/mediaSigner.js
          node --check services/trackMediaAccessService.js
          node --check routes/media.js
          node --check routes/tracks.js

      - name: Run paid-track protection regression suite
        run: >-
          npx jest
          tests/paidTrackMediaDeliveryProtection.test.js
          tests/trackPublicMetadataProtection.test.js
          tests/paystackPayments.test.js
          tests/creatorDiscoveryRoutes.test.js
          tests/storyMusicAttachment.test.js
          --runInBand
