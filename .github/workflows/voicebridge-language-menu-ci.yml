name: VoiceBridge Language Menu CI

on:
  pull_request:
    paths:
      - "backend/services/africasTalkingLanguageMenuService.js"
      - "backend/controllers/codeswitchAfricasTalkingController.js"
      - "backend/routes/codeswitch.js"
      - "backend/tests/africasTalkingLanguageMenu.test.js"
      - ".github/workflows/voicebridge-language-menu-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/services/africasTalkingLanguageMenuService.js"
      - "backend/controllers/codeswitchAfricasTalkingController.js"
      - "backend/routes/codeswitch.js"
      - "backend/tests/africasTalkingLanguageMenu.test.js"
      - ".github/workflows/voicebridge-language-menu-ci.yml"

permissions:
  contents: read

jobs:
  telephone-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Syntax-check modified JavaScript
        run: |
          node --check services/africasTalkingLanguageMenuService.js
          node --check controllers/codeswitchAfricasTalkingController.js
          node --check routes/codeswitch.js
          node --check tests/africasTalkingLanguageMenu.test.js
      - name: Run telephone flow regressions
        run: >-
          npx jest
          tests/africasTalkingLanguageMenu.test.js
          tests/africasTalkingVoiceService.test.js
          tests/africasTalkingVoiceRoutes.test.js
          tests/africasTalkingVoiceE2eRoute.test.js
          tests/africasTalkingVoiceProcessingService.test.js
          --runInBand
